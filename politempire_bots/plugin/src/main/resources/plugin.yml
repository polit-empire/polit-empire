name: PolitEmpireBotLink
version: '${project.version}'
main: ru.politempire.botlink.BotLinkPlugin
api-version: '1.21'
description: Интеграция с Telegram/Discord ботом - 2FA, учёт игрового времени, DC-баланс, плейсхолдеры %botlink_playtime% %botlink_dc%
author: PolitEmpire

softdepend:
  - PlaceholderAPI

commands:
  2fa:
    description: Подтвердить код двухфакторной аутентификации
    usage: /2fa <код>
  playtime:
    description: Показать наигранное время (своё или другого игрока)
    usage: /playtime [ник]

permissions:
  botlink.playtime.others:
    description: Просмотр наигранного времени других игроков
    default: true
