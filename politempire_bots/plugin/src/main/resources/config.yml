# Адрес HTTP API (сайт politempire.ru проксирует /api/player/* на бот-сервер).
# MC-сервер НЕ может ходить на 127.0.0.1:8180 (бот живёт на веб-сервере) —
# поэтому здесь публичный домен сайта, а не localhost.
api-url: "https://politempire.ru"
# Секрет API бота (API_SECRET из .env сайта/бота). Сайт передаёт его боту при проксировании.
api-secret: "295e530f36d61a6ed3c7c7c21160a7d747016a164c7d9efac81ec775a660e47e"

# Адрес основного сайта (для синхронизации статистики Towny/KD)
site-url: "https://politempire.ru"
# Должен совпадать с mod_admin_key в site_settings (БД)
mod-admin-key: "4DsPSfW924RhGBB0soDybLD02qQPxyya"

# Таймаут HTTP-запросов к API, секунды
http-timeout-seconds: 5

2fa:
  # Сколько секунд даётся на ввод кода, после - кик (должно быть >= TWOFA_CODE_TTL бота)
  timeout-seconds: 300
  # Сколько неверных попыток до кика
  max-attempts: 3

messages:
  prefix: "&8[&6PolitEmpire&8] &r"
  need-2fa: "&eНа ваш Telegram отправлен код подтверждения. Введите: &6/2fa <код>"
  2fa-success: "&aВход подтверждён. Приятной игры!"
  2fa-wrong: "&cНеверный код. Осталось попыток: &e%attempts%"
  2fa-kick-attempts: "&cПревышено число попыток ввода кода 2FA."
  2fa-kick-timeout: "&cВремя на подтверждение 2FA истекло."
  2fa-usage: "&cИспользование: &e/2fa <код>"
  2fa-not-required: "&7Подтверждение не требуется."
  banned-kick: "&cВы заблокированы.&r\n&7Причина: &f%reason%"
  frozen: "&cСначала подтвердите вход: &e/2fa <код>"
  api-error: "&cОшибка связи с сервером авторизации, попробуйте позже."
  playtime-show: "&eНаигранное время &6%player%&e: &6%time%"
