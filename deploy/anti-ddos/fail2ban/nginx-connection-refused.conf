# Fail2ban filter: ловит "connect() failed (111: Connection refused)"
# в error.log nginx. Когда бэкенд падает от DDoS, nginx не может
# соединиться с upstream — такие IP нужно банить быстрее.
#
# Пример строки error.log:
#   2026/07/22 09:06:12 [error] 1405#1405: *47 connect() failed (111: Connection refused)
#     while connecting to upstream, client: 5.251.162.73, ...
[Definition]
failregex = ^.*connect\(\) failed \(111: Connection refused\) while connecting to upstream.*client: <HOST>.*$
ignoreregex =
