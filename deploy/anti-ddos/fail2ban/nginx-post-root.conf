# Fail2ban filter: блокируем "POST /" на корень сайта.
#
# Главная страница никогда не запрашивается методом POST — это всегда
# бот/сканер/DDoS-запрос. Любой 3+ таких запроса за минуту = бан.
#
# Пример строки access.log:
#   93.77.191.156 - - [19/Jul/2026:11:07:08 +0000] "POST / HTTP/2.0" 429 0 "-" "Mozilla/5.0 ..."

[Definition]

failregex = ^<HOST> -.*"POST / HTTP/\d\.\d" \d+ \d+

ignoreregex =

datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
