# Fail2ban filter: всплеск 429-ответов nginx в access.log.
#
# Срабатывает, когда один IP получает >= maxretry ответов 429 за findtime.
# Используется вместе с jail nginx-429-flood (см. jail.local).
#
# Пример строки access.log:
#   93.77.191.156 - - [19/Jul/2026:11:07:08 +0000] "POST / HTTP/2.0" 429 0 "-" "Mozilla/5.0 ..."

[Definition]

# Группируем по IP (первое поле) и смотрим на HTTP-статус (девятое поле после запроса).
# nginx access log format по умолчанию:
#   $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
failregex = ^<HOST> -.*"[A-Z]+ \S+ HTTP/\d\.\d" 429 \d+

ignoreregex =

datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
