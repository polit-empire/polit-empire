# ============================================================================
# Polit Empire — nginx anti-DDoS конфиг (глобальные правила)
# ----------------------------------------------------------------------------
# Этот файл инклудится на уровне http{} (через /etc/nginx/conf.d/*.conf).
# Содержит:
#   1. real_ip от Cloudflare — чтобы limit_req и fail2ban видели настоящий
#      IP клиента, а не Cloudflare-прокси. Без этого все атаки через .org
#      выглядят как один IP, и банить нельзя.
#   2. Зоны ограничений (limit_req_zone/limit_conn_zone) с разными лимитами
#      под разные классы запросов (общий, /api/, /api/auth, /api/v1/authlib).
#   3. Карты блокировки bad User-Agent и scanner-путей.
#
# Установка:
#   sudo cp deploy/anti-ddos/nginx/00-antiddos.conf /etc/nginx/conf.d/00-antiddos.conf
#   sudo cp deploy/anti-ddos/nginx/antiddos-server.conf /etc/nginx/snippets/antiddos-server.conf
#   # в каждый server{...} домена добавить:  include snippets/antiddos-server.conf;
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Real IP от Cloudflare.
#    set_real_ip_from говорит nginx: "если соединение пришло от этого CIDR,
#    доверяй заголовку CF-Connecting-IP и подставляй его как $remote_addr".
#    Запросы напрямую на .ru (мимо Cloudflare) НЕ попадают под эти правила —
#    их $remote_addr остаётся настоящим IP клиента, даже если он подделал
#    заголовок CF-Connecting-IP.
# ----------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Весь клиентский трафик (лаунчер, сайт, GML) приходит через фронт-прокси
# 85.192.56.40, который дописывает X-Forwarded-For с настоящим IP клиента.
# Без доверия этому IP все игроки выглядят как один IP — и любой per-IP лимит
# (limit_req) мгновенно даёт 429 всему серверу сразу.
set_real_ip_from 85.192.56.40;    # фронт-прокси / MC-сервер / внешняя MySQL
set_real_ip_from 144.31.0.116;    # этот сервер (публичный IP)
set_real_ip_from 82.117.87.152;   # этот сервер (старый публичный IP)
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ----------------------------------------------------------------------------
# 2. Зоны ограничений. Старый zz-ratelimit.conf (10r/s, burst 30) мы заменяем
#    на более гранулярные лимиты: общий, API, auth, authlib.
#    ВАЖНО: zz-ratelimit.conf нужно удалить/переименовать, иначе будет
#    двойной лимит (limit_req zone=perip) на каждый запрос.
# ----------------------------------------------------------------------------
# Trusted IP whitelist — Minecraft-сервера и собственные сервисы, которые
# делают много параллельных API-запросов и НЕ должны попадать под rate-limit.
# Без этого pligin PoliteShopMod на Minecraft-сервере делает десятки
# POST /api/mod/admin/dc в секунду → exceed limit → fail2ban банит IP →
# игроки видят "серверы аутентификации недоступны".
#
# Как добавить IP: допишите строку вида  "1.2.3.4  0;"  сюда и в jail.local
# (ignoreip). Список через CIDR или по одному IP.
geo $is_trusted_ip {
    default        0;
    127.0.0.1      1;
    ::1            1;
    82.117.87.152  1;   # этот же сервер (localhost-трафик)
    79.137.71.8    1;   # Minecraft-сервер (PoliteShopMod → /api/mod/*)
 85.192.56.40 1; # фронт-прокси: весь трафик лаунчера/игроков + плагин + MySQL
 144.31.0.116 1; # этот сервер (публичный IP)
     109.187.209.76 1; # администратор
    37.122.69.248  1;   # администратор (чтобы fail2ban не банил)
    172.16.0.0/12  1;   # docker-сеть: GML-бэкенд (172.18.x) ходит на наш
                        # /api/gml/auth напрямую по 144.31.0.116 (см. /etc/hosts
                        # контейнера) — не должен попадать под rate-limit.
}

# Ключ зоны: для trusted IP — пустой (nginx не считает такие запросы в лимите
# вообще, см. доку limit_req_zone: "if the key value is empty, the request
# is not counted"). Для остальных — $binary_remote_addr как обычно.
map $is_trusted_ip $limit_key {
    default       $binary_remote_addr;
    1             "";
}

limit_req_zone  $limit_key zone=antiddos_general:20m  rate=30r/s;
limit_req_zone  $limit_key zone=antiddos_api:10m       rate=20r/s;
limit_req_zone  $limit_key zone=antiddos_mod:10m       rate=50r/s;
limit_req_zone  $limit_key zone=antiddos_auth:5m       rate=2r/s;
limit_req_zone  $limit_key zone=antiddos_authlib:10m   rate=300r/s;
limit_conn_zone $limit_key zone=antiddos_conn:10m;

# Global rate limit — total requests to the server, regardless of IP.
# This caps the total load on the upstream Next.js backend during DDoS.
# Global rate limit key: for trusted IPs (whitelist) — empty (not counted),
# for everyone else — "global" (all share one counter = true global limit).
map $is_trusted_ip $global_limit_key {
    default   "global";
    1         "";
}
# Отдельная зона на каждый vhost: флуд на gml (GET / через CF) не должен
# выедать бюджет главного сайта (politempire.ru/.org).
limit_req_zone $global_limit_key zone=antiddos_global_ru:10m  rate=200r/s;
limit_req_zone $global_limit_key zone=antiddos_global_org:10m rate=200r/s;
limit_req_zone $global_limit_key zone=antiddos_global_gml:10m rate=200r/s;

# Жёсткий потолок на пути, которые долбят GML-бэкенд (authlib hasJoined/join,
# signin/checkToken, profiles). Легитимный трафик лаунчера/MC-сервера — единицы
# r/s; 50r/s + burst 100 с запасом. Защищает бэкенд от повтора ситуации, когда
# флуд под видом signin/checkToken вешал 5003 и MC-сервер ловил 504 (5с пинги).
limit_req_zone $global_limit_key zone=antiddos_backend_ru:10m  rate=50r/s;
limit_req_zone $global_limit_key zone=antiddos_backend_org:10m rate=50r/s;
limit_req_zone $global_limit_key zone=antiddos_backend_gml:10m rate=50r/s;

# Что отвечать при срабатывании лимитов. 429 — стандартный "Too Many Requests".
limit_req_status  429;
limit_conn_status 429;

# ----------------------------------------------------------------------------
# 3. Карты для классификации User-Agent и URI.
#    map даёт 1 для "плохих" значений, потом используем if ($bad_ua) { return 403; }
# ----------------------------------------------------------------------------
# Плохие User-Agent: известные DDoS-боты и хакерские тулзы.
# Реальные браузеры НЕ попадают сюда — у них UA начинается с Mozilla/5.0
# и содержит реальные признаки (AppleWebKit, Chrome, Firefox, Safari).
#
# ВАЖНО: НЕ блокируем пустой UA! Легитимные программные клиенты шлют пустой
# User-Agent: .NET HttpClient (Gml.Web.Api использует его для запросов к
# нашему /api/gml/auth), Python requests без явного UA, мониторинг-системы.
# Блок пустого UA ломает Custom-провайдер авторизации GML — лаунчер получает
# "не удалось прочитать ответ, сайт прислал html вместо json" (403 HTML).
# Если нужно резать пустой UA — добавьте его в map, но тогда whitelist'те
# IP GML-контейнера (он за Cloudflare, так что нужен X-Forwarded-For подход).
map $http_user_agent $bad_ua {
    default              0;
    "~*acunetix"         1;        # Acunetix Web Vulnerability Scanner
    "~*nikto"            1;        # Nikto scanner
    "~*sqlmap"           1;        # sqlmap
    "~*masscan"          1;        # masscan
    "~*nmap"             1;        # nmap
    "~*zgrab"            1;        # zgrab crawler
    "~*Go-http-client"   1;        # Go HTTP bot
    "~*Python-urllib"    1;        # Python urllib
    "~*python-requests"  1;        # python-requests бот (частый DDoS-инструмент)
    "~*libwww-perl"      1;        # Perl LWP
    "~*HEADLESS"         1;        # headless-браузеры иногда помечают так
    # Намеренно НЕ блокируем: пустой UA, curl, wget, bot/crawler.
    # Пустой UA = легитимные программные клиенты (GML .NET HttpClient).
}

# Плохие URI — типичные пути сканеров. Легитимного трафика тут не бывает.
# Баним сразу 403 → fail2ban/nginx-forbidden потом банит IP.
map $request_uri $bad_uri {
    default              0;
    "~*/wp-admin"        1;
    "~*/wp-login"        1;
    "~*/wp-config"       1;
    "~*/wp-content"      1;
    "~*/wp-includes"     1;
    "~*/wordpress"       1;
    "~*/xmlrpc\.php"     1;
    "~*/phpmyadmin"      1;
    "~*/pma/"            1;
    "~*/myadmin"         1;
    "~*/.env"            1;
    "~*/.git"            1;
    "~*/.svn"            1;
    "~*/.aws"            1;
    "~*/config\.php"     1;
    "~*/admin\.php"      1;
    "~*/phpinfo"         1;
    "~*/shell\.php"      1;
    "~*/eval-stdin"      1;
    "~*/etc/passwd"      1;
    "~*/cgi-bin"         1;
    "~*/vendor/phpunit"  1;
    "~*/telescope"       1;
    "~*/actuator"        1;
    "~*\.\./\.\./"       1;       # path traversal
    "~*\.\.%2f"          1;       # encoded traversal
}

# Карта методов: разрешаем только безопасные. TRACE/CONNECT/etc — бан.
map $request_method $bad_method {
    default  1;
    GET      0;
    POST     0;
    HEAD     0;
    OPTIONS  0;
    PUT      0;
    PATCH    0;
    DELETE   0;
}

# POST на главную страницу — всегда бот/атака (реальный браузер и лаунчер
# главную POST-ом не запрашивают). Атакующие слали POST /?msclkid=...,
# POST /?utm_*=... и т.п. через Cloudflare-прокси (firewall не режет CF).
# Проверяем до limit_req (server rewrite phase < preaccess) — токены
# глобального лимита на флуд не тратятся.
map "$request_method:$uri" $bad_post_root {
    "POST:/"  1;
    default   0;
}

# ----------------------------------------------------------------------------
# 3b. Что логировать в access.log.
#     Во время DDoS access.log разбухает до гигабайт однотипными 429 от ботов.
#     429 неинформативны (fail2ban читает их из error.log через jail
#     nginx-limit-req — там они пишутся на уровне warn) и забивают диск.
#     Остальные статусы (200/3xx/403/404/405/5xx) логируем — они нужны
#     jail'ам nginx-forbidden (403), nginx-botsearch (403/404 по scanner-путям)
#     и nginx-post-root (405 от POST /), а также для общей отладки.
# ----------------------------------------------------------------------------
map $status $loggable {
    default  1;
    400      0;   # malformed request — почти всегда боты
    429      0;   # limit_req — логируется в error.log, в access.log не дублируем
    444      0;   # closed connection without response
}

# ----------------------------------------------------------------------------
# 4. Тонкая настройка таймаутов против slowloris-атаки.
#    Медленные клиенты держат соединение открытым — это память nginx.
# ----------------------------------------------------------------------------
client_body_timeout     10s;
client_header_timeout   10s;
keepalive_timeout       30s;
send_timeout            10s;
reset_timedout_connection on;

# Ограничиваем размер тела для большинства запросов (кроме GML-загрузок, где
# client_max_body_size 2G задаётся в server{}).
client_body_buffer_size 16k;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;

# ----------------------------------------------------------------------------
# 5. Снижаем шум error.log от limit_req — иначе диск снова забьёт.
#    По умолчанию limit_req_log_level = error; понижаем до warn (или вообще
#    отключаем логирование лишений, если нужно). Но для fail2ban нужен лог,
#    поэтому оставляем warn и используем filter nginx-limit-req (он парсит
#    любой уровень).
# ----------------------------------------------------------------------------
limit_req_log_level warn;
limit_conn_log_level warn;

# ----------------------------------------------------------------------------
# 6. Прокси-таймауты — быстро отваливаемся от перегруженного upstream.
#    Во время DDoS не ждём 60+ секунд ответа от Next.js.
# ----------------------------------------------------------------------------
proxy_connect_timeout 5s;
proxy_send_timeout    10s;
proxy_read_timeout    20s;
