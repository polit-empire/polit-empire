worker_rlimit_nofile 200000;
user www-data;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_core 500M;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 16384;
	multi_accept on;
	use epoll;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 2048;
	server_tokens off;

	server_names_hash_bucket_size 128;
	server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Max size of the proxy cache (1GB for static assets)
	proxy_cache_path /var/cache/nginx/proxy_cache levels=1:2 keys_zone=static_cache:100m max_size=1g inactive=60m use_temp_path=off;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	# Log format with upstream time for debugging
	log_format upstream '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

	##
	# Gzip Settings
	##

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 4;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_min_length 256;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

	# Open file cache — уменьшает число open() системных вызовов
	open_file_cache max=20000 inactive=60s;
	open_file_cache_valid 30s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;

	# Увеличиваем буферы для больших ответов и редиректов
	fastcgi_buffers 16 16k;
	fastcgi_buffer_size 32k;
	proxy_buffers 16 16k;
	proxy_buffer_size 8k;
	proxy_busy_buffers_size 32k;

	# HTTP/2 — отключаем конкатенацию для снижения утечки данных
	http2_max_concurrent_streams 128;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


