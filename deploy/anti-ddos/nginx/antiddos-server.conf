# ============================================================================
# Polit Empire — nginx anti-DDoS snippet для server{} блоков.
# ----------------------------------------------------------------------------
# Включать в начало каждого server{...} (после ssl-настроек, перед location /):
#
#   server {
#       listen 443 ssl;
#       server_name politempire.org ...;
#       ssl_certificate ...;
#       ssl_certificate_key ...;
#       include snippets/antiddos-server.conf;   # <-- вот сюда
#       location / { ... }
#   }
#
# Что делает:
#   • limit_conn — не больше 20 одновременных соединений с IP.
#   • Блок POST / (главную никогда не запрашивают POST) → 405.
#   • Блок плохих методов (TRACE/CONNECT и т.п.) → 405.
#   • Блок плохих User-Agent (пустые, sqlmap/nmap/acunetix) → 403.
#   • Блок scanner-путей (/wp-admin, /.env, /xmlrpc.php и т.п.) → 403.
#   • Закрываем соединение без ответа на scanner-пути — экономим логи.
# ============================================================================

# Не больше 20 одновременных HTTP-соединений с одного IP на этот server.
# Легитимный браузер открывает 2-6 соединений; DDoS — сотни.
limit_conn antiddos_conn 30;

# 1. Блокируем плохие методы (TRACE, CONNECT, DEBUG и прочее).
if ($bad_method) {
    return 405;
}

# 2. Блокируем плохие User-Agent. ВАЖНО: if внутри server выполняется до
#    location, поэтому тут это безопасно (return финализирует запрос).
if ($bad_ua) {
    return 403;
}

# 3. Блокируем scanner-пути. return 403 → fail2ban/nginx-forbidden банит IP.
if ($bad_uri) {
    return 403;
}

# 4. Главная страница — только GET/HEAD. POST / — это 100% бот/атака.
#    Определяем "это корень и не GET/HEAD" через map (нельзя сравнивать
#    $uri и $request_method в одном if — поэтому используем комбинированную
#    карту ниже в server, а тут только ставим заглушку через location /post-root).
#
# Реализация: см. location = / ниже в server{} — там стоит ограничение
# методов через limit_except. Здесь намеренно НЕТ if($request_method = POST),
# потому что if с $request_method небезопасен в server context.

# ----------------------------------------------------------------------------
# Общий лимит запросов на этот server. Зона antiddos_general: 15r/s с burst.
# burst=40 nodelay: пропускаем всплески легитимных пользователей (у них
# страница тянет ~20 ресурсов сразу), но отбиваем устойчивый поток.
# ----------------------------------------------------------------------------
limit_req zone=antiddos_general burst=100 nodelay;
limit_req zone=antiddos_global burst=300 nodelay;

# ----------------------------------------------------------------------------
# 4. POST на корень — 100% бот (см. map $bad_post_root в 00-antiddos.conf).
#    Проверяется в rewrite phase, ДО limit_req — токены не тратит.
if ($bad_post_root) {
    return 405;
}

# 5. ВРЕМЕННО (DDoS-режим): отсечка бот-флуда по трекинг-параметрам в query.
#    Атака 16k+ IP бьёт в корень сайта /?ref=..., /?utm_*, /?gclid=...,
#    /?fbclid=..., /?_ga=..., /?_gl=..., /?source=... с поддельными
#    браузерными UA. Возвращаем 429 ДО проксирования в Next.js.
#    ВНИМАНИЕ: временная мера — блокирует и легитимные рекламные переходы
#    с этими параметрами. Снять после окончания атаки.
# ----------------------------------------------------------------------------
if ($args ~ "^(utm_|ref|gclid|fbclid|yclid|msclkid|wbraid|gbraid|igshid|mc_eid|_ga|_gl|source)") {
    return 429;
}
