# politempire.org — ОСНОВНОЙ домен сайта (Next.js).
#
# ПРОБЛЕМА, которую решает этот файл: на politempire.org открывается панель
# «Gml Frontend» вместо сайта. Так происходит, если корень `/` домена
# проксируется на GML-прокси (порт 5003). Ниже `/` уходит на сайт (порт 3001),
# а на GML остаётся только authlib-путь `/api/v1/` для игры.
#
# ВАЖНО ПРО ПОРТ: контейнер gml-web-frontend занимает порт 3000, поэтому наш
# сайт (service `app`) слушает 3001 (APP_PORT=3001 в .env). Проксируем на 3001.
#
# Панель управления GML должна жить на ОТДЕЛЬНОМ поддомене gml.politempire.org
# (см. второй server-блок), а не на корне politempire.org.
#
# Установка:
#   sudo cp deploy/nginx-politempire-org.conf /etc/nginx/sites-available/politempire.org
#   sudo ln -sf /etc/nginx/sites-available/politempire.org /etc/nginx/sites-enabled/politempire.org
#   sudo nginx -t && sudo systemctl reload nginx
# Если для politempire.org уже есть старый server-блок в другом файле
# (например default) — удалите/отключите его симлинк в sites-enabled.

# ---- HTTP → HTTPS -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name politempire.org www.politempire.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Основной сайт ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name politempire.org www.politempire.org;

    ssl_certificate     /etc/letsencrypt/live/politempire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/politempire.org/privkey.pem;

    client_max_body_size 2G;

    # Authlib для игры (joinserver/hasJoined) — на GML-бэкенд (5003).
    # ВАЖНО: этот блок ДО location / .
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Сайт (Next.js, docker-compose service `app`, порт APP_PORT=3001).
    # ВНИМАНИЕ: порт 3000 занят контейнером gml-web-frontend, поэтому сайт
    # слушает 3001 (APP_PORT=3001 в .env). Проксируем именно на 3001.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# ---- Панель управления GML (отдельный поддомен) -----------------------------
# Именно сюда переезжает «Gml Frontend», который раньше открывался на корне.
server {
    listen 80;
    listen [::]:80;
    server_name gml.politempire.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gml.politempire.org;

    ssl_certificate     /etc/letsencrypt/live/politempire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/politempire.org/privkey.pem;

    client_max_body_size 2G;

    # Вся панель и её API — на GML-прокси (5003): / → панель, /api → GML API.
    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# ============================================================================
# После установки:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Проверка:
#   curl -sI https://politempire.org/           # должен отдавать сайт (Next.js)
#   curl -s  https://politempire.org/api/v1/integrations/authlib/minecraft | head
#   # gml.politempire.org — панель GML (нужна A-запись DNS на 82.117.87.152
#   #  и сертификат: sudo certbot --nginx --expand -d politempire.org \
#   #  -d www.politempire.org -d gml.politempire.org)
# ============================================================================
