# politempire.ru — прямой домен (БЕЗ Cloudflare), указывает на 82.117.87.152.
#
# Решает две проблемы:
# 1. «Недействительная сессия» у игроков с российских IP: authlib-запросы игры
#    (joinserver/hasJoined) теперь идут сюда, минуя Cloudflare, который
#    нестабильно доступен из РФ. Лаунчер собран с AUTHLIB_API_BASE = https://politempire.ru.
# 2. «Не защищено» в браузере: сертификат должен включать politempire.ru
#    (см. команду certbot в конце файла).
#
# Установка: положить в /etc/nginx/sites-available/politempire.ru
# и создать симлинк в sites-enabled (или заменить существующий блок для .ru).

server {
    listen 80;
    listen [::]:80;
    server_name politempire.ru www.politempire.ru;

    # Для выпуска/продления сертификата Let's Encrypt (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name politempire.ru www.politempire.ru;

    # Пути обновятся автоматически после `certbot --expand` (см. ниже).
    ssl_certificate     /etc/letsencrypt/live/politempire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/politempire.org/privkey.pem;

    client_max_body_size 2G;   # загрузка модов/сборок в панель

    # ---- Authlib для игры (обход Cloudflare) --------------------------------
    # Запросы игры (joinserver/hasJoined) идут на GML-бэкенд (порт 5003)
    # напрямую, минуя Cloudflare, — это решает «недействительную сессию» из РФ.
    # ВАЖНО: этот блок должен идти ПЕРЕД location / .
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Основной сайт (Next.js, порт APP_PORT=3001) ------------------------
    # Порт 3000 занят контейнером gml-web-frontend, поэтому сайт слушает 3001.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# ============================================================================
# Команды на сервере (по SSH), выполнить один раз:
#
# 1. Расширить сертификат, добавив politempire.ru (и www, если есть A-запись):
#    sudo certbot --nginx --expand \
#      -d politempire.org -d gml.politempire.org \
#      -d politempire.ru
#    (перечислите ВСЕ домены, которые уже есть в текущем сертификате,
#     плюс politempire.ru; список текущих: sudo certbot certificates)
#
# 2. Проверить и перезагрузить nginx:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 3. Проверка authlib-прокси (должен вернуть JSON метаданных, а не сайт):
#    curl -s https://politempire.ru/api/v1/integrations/authlib/minecraft | head
#
# Рекомендация: у Minecraft-сервера (Paper) authlib-injector тоже должен
# ходить не через Cloudflare. Если сервер стоит на этой же машине, укажите
# в его параметрах -javaagent:authlib-injector.jar=http://127.0.0.1:5003/api/v1/integrations/authlib/minecraft
# либо https://politempire.ru/api/v1/integrations/authlib/minecraft.
# ============================================================================
