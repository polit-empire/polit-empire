# PolitSkins 2.0 — скины PolitEmpire для Paper 1.21.1
#
# ЧТО ИЗМЕНИЛОСЬ ПО СРАВНЕНИЮ С 1.0
#
#  1. Плащи удалены полностью. Ни одного файла плаща заведено не было, а URL
#     всё равно дёргался на каждый рендер — впустую.
#  2. Плагин работает как ФОЛБЭК, а не как основной источник скинов.
#     На сервере стоит authlib-injector, он получает скины прямо из GML уже
#     подписанными. Если у игрока текстура пришла — плагин не делает НИЧЕГО
#     и не ходит в сеть вообще. Он вмешивается только когда текстуры нет.
#  3. Домен .ru вместо .org: .org идёт через Cloudflare, который у части
#     российских игроков блокируется, и скин не скачивается.

# Откуда брать PNG скина. {userName} подставляется ником игрока.
skin-url: "https://politempire.ru/api/skins/{userName}.png"

# Фолбэк-режим. true (по умолчанию) — ставить скин только тем игрокам, у кого
# authlib не проставил текстуру. false — ставить всем подряд, как в версии 1.0
# (это заметно больше запросов и к сайту, и к MineSkin; включай осознанно).
fallback-only: true

mineskin:
  # Ключ https://mineskin.org — им подписываются текстуры.
  # БЕЗ КЛЮЧА работает на публичном лимите: запросы идут медленно и часто
  # отбиваются 429. В фолбэк-режиме обращений мало, но ключ лучше завести.
  api-key: ""

# Сколько дней держать подписанную текстуру в кэше (plugins/PolitSkins/cache).
# Кэш ключуется по SHA-256 самого PNG: сменил игрок скин — кэш промахнётся сам,
# так что большое значение безопасно.
cache-days: 30

# Таймаут HTTP-запросов, секунды.
http-timeout-seconds: 10

# Перепроверять скин при каждом входе, игнорируя кэш. Обычно не нужно.
always-refresh-on-join: false
